version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    # Same rule as GG006 and the Gemfile's `cooldown: 7`: only propose versions
    # that have been public for a week.
    cooldown:
      default-days: 7
    # Major versions are upgraded by hand. simplecov 1.3 and parallel 2 need
    # Ruby 3.3, while the gem supports 3.2.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: simplecov
        versions: [">= 1.3"]
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
